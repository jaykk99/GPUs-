<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPUs- — Reserved Workspace</title>
    <meta name="description" content="GPUs- is a reserved placeholder repository. Nothing is built here yet.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            background: #0b0d10; color: #f2f4f7; line-height: 1.6;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 560px; text-align: center;
            background: #14181e; border: 1px dashed #2a3340;
            border-radius: 16px; padding: 48px 40px;
        }
        .card .icon { font-size: 48px; margin-bottom: 18px; }
        .card h1 { font-size: 30px; margin-bottom: 12px; }
        .card p { color: #9aa3b2; font-size: 16px; margin-bottom: 10px; }
        .card a { color: #00c9ff; }
        .status {
            display: inline-block; margin-top: 16px; font-size: 13px;
            font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            color: #e8b23a; border: 1px solid #3a3220; background: rgba(232,178,58,.08);
            padding: 6px 16px; border-radius: 999px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📦</div>
        <h1>GPUs-</h1>
        <p>This repository is a reserved placeholder workspace.</p>
        <p>Nothing is built, installed, or run here yet. When a project takes shape, it will be documented in the <a href="https://github.com/jaykk99/GPUs-">README</a> first.</p>
        <span class="status">Reserved — no content yet</span>
    </div>
</body>
</html>
